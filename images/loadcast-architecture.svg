<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1780 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1780" height="480" fill="#ffffff"/>

  <!-- legend -->
  <rect x="40" y="20" width="18" height="18" fill="#dce8f5" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="64" y="34" font-size="16" fill="#333">frozen</text>
  <rect x="150" y="20" width="18" height="18" fill="#fde3cc" stroke="#c76b2c" stroke-width="1.5"/>
  <text x="174" y="34" font-size="16" fill="#333">trainable</text>
  <text x="890" y="34" text-anchor="middle" font-size="15" fill="#888">loadcast: reprogramming a frozen, general-purpose LLM for time-series forecasting</text>

  <!-- 1. input: kWh history -->
  <rect x="40" y="215" width="210" height="90" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <text x="145" y="255" text-anchor="middle" font-size="16" fill="#333">kWh history</text>
  <text x="145" y="275" text-anchor="middle" font-size="14" fill="#555">7 days</text>

  <line x1="250" y1="260" x2="280" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. RevIN + patch embed -->
  <rect x="280" y="215" width="210" height="90" rx="6" fill="#fde3cc" stroke="#c76b2c" stroke-width="1.5"/>
  <text x="385" y="255" text-anchor="middle" font-size="16" fill="#333">RevIN normalize</text>
  <text x="385" y="275" text-anchor="middle" font-size="14" fill="#555">+ patch embed</text>

  <line x1="490" y1="260" x2="520" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- side above: covariates, feeding down into the 2->3 arrow. Centered on box 3 (x=520, w=210 -> center 625) -->
  <rect x="510" y="70" width="230" height="90" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <text x="625" y="98" text-anchor="middle" font-size="13" fill="#333">temperature · holiday</text>
  <text x="625" y="117" text-anchor="middle" font-size="13" fill="#333">hour · day-of-week</text>
  <text x="625" y="136" text-anchor="middle" font-size="13" fill="#333">ACORN group · tariff</text>
  <text x="625" y="155" text-anchor="middle" font-size="12" fill="#888">(each its own encoder)</text>
  <line x1="625" y1="160" x2="625" y2="252" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. gated fusion -->
  <rect x="520" y="215" width="210" height="90" rx="6" fill="#fde3cc" stroke="#c76b2c" stroke-width="1.5"/>
  <text x="625" y="255" text-anchor="middle" font-size="15" fill="#333">gated fusion</text>
  <text x="625" y="275" text-anchor="middle" font-size="12" fill="#555">covariate + static encoders</text>

  <line x1="730" y1="260" x2="760" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. reprogramming -->
  <rect x="760" y="215" width="210" height="90" rx="6" fill="#fde3cc" stroke="#c76b2c" stroke-width="1.5"/>
  <text x="865" y="255" text-anchor="middle" font-size="15" fill="#333">reprogramming</text>
  <text x="865" y="275" text-anchor="middle" font-size="12" fill="#555">cross-attn into LLM token space</text>

  <!-- side below: vocab prototypes, feeding up into the 4->5 arrow. Centered on box 4 (x=760, w=210 -> center 865) -->
  <rect x="750" y="360" width="230" height="90" rx="6" fill="#dce8f5" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="865" y="390" text-anchor="middle" font-size="14" fill="#333">vocab prototypes</text>
  <text x="865" y="409" text-anchor="middle" font-size="12" fill="#555">k-means over EuroLLM's</text>
  <text x="865" y="426" text-anchor="middle" font-size="12" fill="#555">own frozen embeddings</text>
  <line x1="865" y1="360" x2="865" y2="308" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="970" y1="260" x2="1000" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. EuroLLM + LoRA, taller box -->
  <rect x="1000" y="150" width="230" height="220" rx="6" fill="#dce8f5" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="1115" y="195" text-anchor="middle" font-size="18" font-weight="600" fill="#222">EuroLLM-1.7B</text>
  <text x="1115" y="217" text-anchor="middle" font-size="13" fill="#555">backbone, frozen</text>
  <rect x="1030" y="260" width="170" height="80" rx="6" fill="#fde3cc" stroke="#c76b2c" stroke-width="1.5"/>
  <text x="1115" y="292" text-anchor="middle" font-size="14" fill="#333">LoRA adapters</text>
  <text x="1115" y="311" text-anchor="middle" font-size="11" fill="#555">q/k/v/o, gate/up/down</text>

  <line x1="1230" y1="260" x2="1260" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 6. forecast head -->
  <rect x="1260" y="215" width="200" height="90" rx="6" fill="#fde3cc" stroke="#c76b2c" stroke-width="1.5"/>
  <text x="1360" y="260" text-anchor="middle" font-size="16" fill="#333">forecast head</text>

  <line x1="1460" y1="260" x2="1490" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 7. output -->
  <rect x="1490" y="215" width="250" height="90" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <text x="1615" y="255" text-anchor="middle" font-size="15" fill="#333">day-ahead forecast</text>
  <text x="1615" y="275" text-anchor="middle" font-size="13" fill="#555">half-hourly</text>
</svg>
