{% include base_path %}

<!-- start custom head snippets -->

<!-- Serif headings font -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="var(--global-bg-color)"/>


<!-- Tighter type scale & spacing, neutral (non-blue) link color -->
<style>
  body { line-height: 1.55; }
  .page__content p,
  .page__content li { margin-bottom: 0.6em; }
  .archive__item { margin-bottom: 1.25em; }
  .archive__item-title { margin-top: 0.5em; margin-bottom: 0.25em; }
  .archive__subtitle { margin-top: 1em; padding-bottom: 0.25em; }
  .page__title { margin-bottom: 0.5em; }
  .masthead { min-height: auto; }
  .masthead__inner-wrap { padding-top: 0.75em; padding-bottom: 0.75em; }

  /* Serif headings, sans body */
  .page__title,
  .archive__item-title,
  .sidebar .author__name,
  .masthead__menu-item--lg a,
  .cv-content h2 {
    font-family: "Source Serif 4", Georgia, serif;
  }

  /* CV page styling */
  .cv-content h2 {
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 1em;
    font-weight: 600;
    border-bottom: 2px solid var(--global-border-color);
    padding-bottom: 0.5em;
    margin-top: 2em;
    margin-bottom: 1.1em;
  }
  .cv-content h2:first-of-type { margin-top: 0; }
  .cv-entry {
    position: relative;
    margin-left: 0.6em;
    padding-left: 1.25em;
    padding-bottom: 1.5em;
    border-left: 2px solid var(--global-border-color);
  }
  .cv-entry:last-child { padding-bottom: 0.1em; }
  .cv-entry::before {
    content: "";
    position: absolute;
    left: -5px;
    top: 0.4em;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--global-text-color);
  }
  .cv-entry > p:first-of-type { margin-bottom: 0.15em; }
  .cv-entry > p:nth-of-type(2) {
    font-style: italic;
    color: var(--global-text-color-light);
    margin-top: 0;
    margin-bottom: 0.7em;
  }
  .cv-entry ul {
    margin-top: 0;
    list-style: none;
    padding-left: 1em;
  }
  .cv-entry ul li {
    position: relative;
    margin-bottom: 0.75em;
  }
  .cv-entry ul li::before {
    content: "–";
    position: absolute;
    left: -1em;
    color: var(--global-text-color-light);
  }
  .cv-skill-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4em;
    margin-bottom: 0.7em;
  }
  .cv-skill-label {
    font-weight: 700;
    margin-right: 0.3em;
  }
  .cv-tag {
    display: inline-block;
    padding: 0.15em 0.7em;
    border-radius: 999px;
    border: 1px solid var(--global-border-color);
    background: var(--global-footer-bg-color);
    font-size: 0.85em;
  }

  /* News page */
  .news-item {
    display: flex;
    gap: 1.25em;
    padding: 0.9em 0;
    border-bottom: 1px solid var(--global-border-color);
  }
  .news-item:last-child { border-bottom: none; }
  .news-date {
    flex: 0 0 5.5em;
    color: var(--global-text-color-light);
    font-size: 0.85em;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding-top: 0.15em;
  }
  .news-text { flex: 1; }
  @media (max-width: 600px) {
    .news-item { flex-direction: column; gap: 0.2em; }
  }
</style>

<!-- end custom head snippets -->
